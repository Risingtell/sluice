name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The job only reads the repository; grant nothing else to the job's token.
permissions:
  contents: read

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
